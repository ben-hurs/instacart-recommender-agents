services:
  postgres:
    image: postgres:16                      
    container_name: instacart-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                    
    volumes:
      - instacart-postgres-data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro

volumes:
  instacart-postgres-data:                               