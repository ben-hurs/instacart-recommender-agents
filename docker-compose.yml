services:
  postgres:
    image: postgres:16
    container_name: instacart-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - instacart-postgres-data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: instacart-app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  instacart-postgres-data:
