# Tema do painel: "encarte de supermercado", o mesmo visual da capa do vídeo.
# Verde de placa de corredor, vermelho de oferta, amarelo de etiqueta de preço,
# fundo creme de papel. Fonte Archivo (títulos pesados de encarte) e
# IBM Plex Mono (números, como num cupom fiscal).
[theme]
base = "light"
primaryColor = "#e2231a"              # vermelho de oferta: botões principais
backgroundColor = "#f4eee2"           # creme
secondaryBackgroundColor = "#fffdf7"  # papel: campos e tabelas
textColor = "#1b1a17"
linkColor = "#0b5d3b"
linkUnderline = false
borderColor = "#e2d9c6"
dataframeBorderColor = "#e8e0cf"
dataframeHeaderBackgroundColor = "#f7f1e4"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "9999px"
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
headingFontWeights = [900, 800, 800, 700, 700, 700]
metricValueFontWeight = 900
metricValueFontSize = "2rem"
codeBackgroundColor = "#f7f1e4"
greenColor = "#1f7a4f"
redColor = "#e2231a"
yellowColor = "#b88a00"
grayColor = "#6b665c"
chartCategoricalColors = ["#1f7a4f", "#e2231a", "#6b665c"]

# Barra lateral verde, como a placa de corredor.
[theme.sidebar]
backgroundColor = "#0b5d3b"
secondaryBackgroundColor = "#0f6b45"
textColor = "#f4eee2"
borderColor = "#0f6b45"
primaryColor = "#ffd21f"

[client]
toolbarMode = "viewer"                # esconde o botão "Deploy" do topo

[server]
headless = true

[browser]
gatherUsageStats = false
