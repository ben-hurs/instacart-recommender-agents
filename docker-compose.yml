services:
  postgres:
    image: postgres:16
    container_name: instacart-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - instacart-postgres-data:/var/lib/postgresql/data
      - ./data:/data:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: instacart-qdrant
    ports:
      - "6333:6333"
    volumes:
      - instacart-qdrant-data:/qdrant/storage

  app:
    build: .
    image: instacart-app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      FASTEMBED_CACHE_PATH: /models
    volumes:
      - ./:/app
      - instacart-models:/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  instacart-postgres-data:
  instacart-qdrant-data:
  instacart-models:
